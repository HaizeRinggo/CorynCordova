<div class="container-fluid py-5 px-3 text-center">
    <div class="card shadow mx-auto" style="max-width: 380px;">
        <div class="card-body p-4 p-md-5">
            <span class="font-pixel fs-4 text-success-emphasis d-block mb-4">CORYN</span>

            <div ng-if="estado === 'confirmando'">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p class="text-secondary mb-0">Confirmando sesión...</p>
            </div>

            <div ng-if="estado === 'ok'">
                <i class="bi bi-check-circle-fill text-success fs-1 d-block mb-3"></i>
                <p class="mb-0">¡Listo! Ya puedes ver tu televisor.</p>
            </div>

            <div ng-if="estado === 'error'" class="alert alert-warning d-flex align-items-center mb-0">
                <i class="bi bi-exclamation-triangle me-2"></i>{{ mensaje }}
            </div>
        </div>
    </div>
</div>
