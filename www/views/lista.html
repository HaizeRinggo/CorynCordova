<div class="container-fluid py-4 px-3 px-xxl-5">

    <div class="d-flex align-items-center gap-2 mb-4">
        <h2 class="font-pixel fs-6 text-success-emphasis mb-0">{{ tituloLista }}</h2>
        <hr class="flex-grow-1 my-0 opacity-25">
        <span class="badge rounded-pill text-bg-secondary">{{ animesLista.length }} animes</span>
    </div>

    <!-- Grid: 2 col móvil / 4 col laptop / 6 col TV -->
    <div class="row row-cols-2 row-cols-md-4 row-cols-xxl-6 g-3">

        <div class="col" ng-repeat="anime in animesLista">
            <div class="card h-100 anime-card" ng-click="verDetalles(anime.id)">
                <div class="anime-card-img-wrap position-relative">
                    <img ng-src="{{ portadaUrl(anime) }}" alt="{{ anime.titulo_oficial || anime.titulo_carpeta }}"
                        loading="lazy">
                    <div class="anime-card-play"><i class="bi bi-play-circle-fill"></i></div>
                </div>
                <div class="card-body py-2 px-2">
                    <p class="anime-card-title small fw-semibold mb-1"
                        title="{{ anime.titulo_oficial || anime.titulo_carpeta }}">
                        {{ anime.titulo_oficial || anime.titulo_carpeta }}
                    </p>
                    <span class="text-primary-emphasis small">{{ anime.episodios_total }} eps</span>
                </div>
            </div>
        </div>

        <!-- Sin resultados -->
        <div class="col-12 text-center py-5" ng-if="animesLista.length === 0 && !cargando">
            <i class="bi bi-emoji-frown fs-1 d-block mb-3 text-secondary"></i>
            <p class="text-secondary mb-0">Aún no hay animes en esta lista.</p>
        </div>

        <!-- Cargando -->
        <div class="col-12 text-center py-5" ng-if="cargando">
            <div class="spinner-border text-primary" role="status"></div>
        </div>
    </div>

</div>
