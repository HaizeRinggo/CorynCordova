<!DOCTYPE html>
<html lang="es" ng-app="angularjsApp" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        script-src 'self' 'unsafe-eval' 'unsafe-inline';
        media-src *;
        img-src 'self' data: content: blob: *;
        connect-src 'self' https://untalhaize.xyz *;
    ">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Coryn</title>

    <link href="assets/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/bootstrap/icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" type="image/png" href="img/logo.png">

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
    <script src="assets/bootstrap/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="assets/js/angular.min.js"></script>
    <script src="assets/js/angular-route.min.js"></script>
    <script src="js/app.js"></script>
</head>

<body>

    <div class="d-flex" style="min-height: 100vh;">

        <!-- ── SIDEBAR: offcanvas en móvil, fijo desde md ── -->
        <nav class="sidebar offcanvas-md offcanvas-start bg-body-tertiary border-end" tabindex="-1" id="sidebarMenu">

            <div class="offcanvas-header d-md-none px-4 pt-4">
                <span class="font-pixel fs-6 text-primary-emphasis">CORYN</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    data-bs-target="#sidebarMenu"></button>
            </div>

            <div class="offcanvas-body d-flex flex-column p-0">

                <a href="#/" class="d-none d-md-block font-pixel fs-6 text-primary-emphasis text-decoration-none px-4 py-4">
                    CORYN
                </a>
                <hr class="d-none d-md-block mx-4 my-0">

                <ul class="nav nav-pills flex-column gap-1 px-3 py-3 app-menu">

                    <li class="nav-item" ng-show="!login && !spinnerGrow">
                        <a class="nav-link" href="#/"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión</a>
                    </li>

                    <li class="nav-item" ng-show="login && !spinnerGrow">
                        <a class="nav-link" href="#/biblioteca"><i class="bi bi-collection-play-fill me-2"></i>Biblioteca</a>
                    </li>

                    <li class="nav-item" ng-show="login && !spinnerGrow && esAdmin">
                        <a class="nav-link" href="#/escaneo"><i class="bi bi-hdd-network-fill me-2"></i>Escanear Disco</a>
                    </li>

                    <li class="nav-item" ng-show="login && !spinnerGrow">
                        <a class="nav-link" href="#/favoritos"><i class="bi bi-heart-fill me-2"></i>Favoritos</a>
                    </li>

                    <li class="nav-item" ng-show="login && !spinnerGrow">
                        <a class="nav-link" href="#/pendientes"><i class="bi bi-hourglass-split me-2"></i>Pendientes</a>
                    </li>

                    <li class="nav-item" ng-show="login && !spinnerGrow">
                        <a class="nav-link" href="#/viendo"><i class="bi bi-play-circle-fill me-2"></i>Viendo</a>
                    </li>

                    <li class="nav-item" ng-show="login && !spinnerGrow">
                        <a class="nav-link" href="#/vistos"><i class="bi bi-check-circle-fill me-2"></i>Vistos</a>
                    </li>

                </ul>

                <div class="mt-auto p-3" ng-show="login && !spinnerGrow">
                    <button type="button" class="btn btn-outline-primary w-100" ng-click="logout()">
                        <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                    </button>
                </div>
            </div>
        </nav>

        <!-- ── CONTENIDO PRINCIPAL ── -->
        <main class="flex-grow-1 d-flex flex-column" style="min-width: 0;">

            <header class="d-flex d-md-none align-items-center px-3 py-2 bg-body-tertiary border-bottom sticky-top">
                <button class="btn btn-outline-secondary btn-sm me-3" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarMenu">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <span class="font-pixel">CORYN</span>
            </header>

            <div class="text-center p-5" ng-if="spinnerGrow">
                <div class="spinner-grow text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>

            <div id="appContent" class="{{ slide }}" ng-show="!spinnerGrow" ng-view></div>

        </main>
    </div>

</body>

</html>
